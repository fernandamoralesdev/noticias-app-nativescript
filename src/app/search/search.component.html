<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="action-bar-title" text="Buscar noticias" colSpan="2"></Label>
    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
  </GridLayout>
</ActionBar>

<GridLayout rows="auto, auto, auto, *" class="page__content">
  <!-- (2) Formulario de búsqueda: caja de texto + botón -->
  <GridLayout row="0" columns="*, auto" class="p-10">
    <TextField
      col="0"
      hint="Buscar por título o categoría"
      [(ngModel)]="texto"
      #textoCtrl="ngModel"
      [minLen]="3"
      returnKeyType="search"
      (returnPress)="buscar(textoCtrl.valid)"
      class="input input-border"
    ></TextField>
    <Button
      col="1"
      text="Buscar"
      class="-primary"
      [isEnabled]="!textoCtrl.invalid && !cargando"
      (tap)="buscar(textoCtrl.valid)"
    ></Button>
  </GridLayout>

  <Label
    row="1"
    *ngIf="textoCtrl.errors?.minLen"
    class="error"
    [text]="'Escribe al menos 3 caracteres (llevas ' + textoCtrl.errors?.minLen?.actual + ')'"
  ></Label>
  <StackLayout row="2" orientation="horizontal" class="estado">
    <ActivityIndicator [busy]="cargando" width="20" height="20"></ActivityIndicator>
    <Label [text]="mensaje" class="contador"></Label>
  </StackLayout>

  <!-- Resultados que llegan desde la API Express (ListView + FlexboxLayout) -->
  <ListView row="3" [items]="resultados">
    <ng-template let-item="item">
      <FlexboxLayout flexDirection="row" flexWrap="wrap" alignItems="center" class="resultado">
        <Label [text]="item.titulo" class="resultado-titulo" flexGrow="1" flexShrink="1" textWrap="true"></Label>
        <Label [text]="item.categoria" class="chip"></Label>
        <!-- (7) Ícono para guardar como favorito -->
        <Label
          class="icono-favorito"
          [class.fas]="esFavorito(item.id)"
          [class.far]="!esFavorito(item.id)"
          [class.activo]="esFavorito(item.id)"
          text="&#xf005;"
          (tap)="alternarFavorito(item)"
        ></Label>
        <Label [text]="item.resumen" class="resultado-resumen" flexBasis="100%" textWrap="true"></Label>
      </FlexboxLayout>
    </ng-template>
  </ListView>
</GridLayout>
