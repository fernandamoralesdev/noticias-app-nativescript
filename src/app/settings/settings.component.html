<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="action-bar-title" text="Settings" colSpan="2"></Label>
    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
  </GridLayout>
</ActionBar>

<StackLayout class="page__content" padding="16">
  <!-- (5) Nombre de usuario leído de forma persistente con ApplicationSettings -->
  <Label text="Nombre de usuario" class="etiqueta"></Label>
  <Label [text]="nombre" class="valor"></Label>

  <Label text="URL de la API (Ngrok)" class="etiqueta"></Label>
  <Label [text]="apiUrl" class="valor" textWrap="true"></Label>

  <Button text="Editar" class="-primary m-t-20" (tap)="editar()"></Button>

  <!-- (1) Token de Firebase Cloud Messaging (para enviar notificaciones de prueba) -->
  <Label text="Token de Firebase (FCM)" class="etiqueta m-t-20"></Label>
  <TextView [text]="token$ | async" editable="false" class="token"></TextView>
  <Button text="Compartir token" (tap)="compartirToken()"></Button>
</StackLayout>
